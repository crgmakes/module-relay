# Aquarius - Automation Simplified
#
# @brief Git script for exporting PCB data for Relay Module
# @note runs manually on demand
# @date 6/11/25
# @author cyberreefguru
# (c) CRG Makes 2025
name: Aquarius-Relay-Module-Full
on:
  workflow_dispatch:
    
jobs:
  export-ecad:
    name: Export ECAD
    runs-on: ubuntu-latest
    container: ghcr.io/inti-cmnb/kicad9_auto_full:latest
      
    steps:
    - name: Update system
      run: |
        echo "Working Directory $(pwd)"
        apt update
        apt -y install git zip

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        path: working/module-relay

    - name: Checkout Extras
      uses: actions/checkout@v4
      with:
        repository: crgmakes/kicad-extras
        path: working/kicad-extras

    - name: Checkout CRGM Library
      uses: actions/checkout@v4
      with:
        repository: crgmakes/kicad-library
        path: working/kicad-library

    - name: Checkout PcbDraw Library
      uses: actions/checkout@v4
      with:
        repository: yaqwsx/PcbDraw-Lib
        path: working/PcbDraw-Lib

    - name: Checkout Fab Kit Library
      uses: actions/checkout@v4
      with:
        repository: bennymeg/Fabrication-Toolkit
        path: working/Fabrication-Toolkit

    - name: Update fonts
      run: |
        mkdir -p /usr/share/fonts/
        cp working/kicad-extras/fonts/* /usr/share/fonts/
        fc-cache -f -v

    # Update PCB with hash of current check in
    - name: Update the PCB with git hash
      run: |
        cd working/module-relay
        export COMMIT=$(git rev-parse --short HEAD)
        echo "COMMIT = ${COMMIT}"    
        echo "ref: '${{ github.ref }}'"
        echo "tag: '${{ github.event.release.tag_name }}'"
        echo "default: '${{ env.default }}'"
        cd pcb
        sed -i "s!<<hash>>!${COMMIT}!" relay-module.kicad_pcb

    # Update PCB with tag
    - name: Update the PCB with git hash and version tag
      run: |
        cd working/module-relay/pcb
        echo "tag: ${{ github.ref_name }}"
        echo "release tag: ${{ github.event.release.tag_name }}"
        sed -i "s!<<tag>>!v0.0.0!" relay-module.kicad_pcb

    # generates fab files for the single PCB, includes gerber, drill, ibom, schematic, images, 3d model, and renders
    - name: Generate Fabrication Files
      run: |
        echo "Working Directory: ${GITHUB_WORKSPACE}"
        cd working/module-relay/
        kibot -c ../kicad-extras/kibot/crgm.kibot.yaml -e pcb/relay-module.kicad_sch -b pcb/relay-module.kicad_pcb -d production create_release_archive_4layer
        # production now contains relay-module-release.zip
        mv production/relay-module-release.zip ../../relay-module-release-v0.0.0.zip
        # relay-module-release-v0.0.0.zip now in home directory

    # generates fab files for the panel PCB, includes gerber, drill, images - does NOT include ibom, 3d model, schematic, or renders
    - name: Generate PCB Panel
      run: |
        cd working/module-relay/pcb/panel
        rm -rf production
        # create the panelized PCB
        kibot -c ../../../kicad-extras/kibot/crgm.kibot.yaml -e ../relay-module.kicad_sch -b ../relay-module.kicad_pcb -d pcb create_panel
        # working/module-relay/pcb/panel/pcb now contains relay-module-panel.kicad_pcb
        # create fab files for panel; does not include renders and 3d model
        kibot -c ../../../kicad-extras/kibot/crgm.kibot.yaml -e ../relay-module.kicad_sch -b pcb/relay-module-panel.kicad_pcb -d production create_panel_archive_4layer
        # production now contains relay-module-panel.zip
        mv production/relay-module-panel.zip .
        # add panelized PCB to archive
        zip -u relay-module-panel.zip pcb/**
        mv relay-module-panel.zip ../../../../relay-module-panel-release-v0.0.0.zip
        # home now contains relay-module-panel-release-v0.0.0.zip

    # Upload fab artifacts to workflow
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: aquarius-relay-module-v0.0.0
        path: |
          relay-module-release-v0.0.0.zip
          relay-module-panel-release-v0.0.0.zip
        if-no-files-found: warn
        retention-days: 30
